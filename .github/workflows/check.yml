name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Install locked test and reference dependencies
        run: nix develop --command uv sync --frozen --group reference
      - name: Verify source and parity contracts
        run: nix develop --command check
