name: checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

# Atlas is shared infrastructure; PRs require an isolated runner.
jobs:
  parity:
    if: github.ref == 'refs/heads/main'
    runs-on:
      group: atlas-trusted
      labels: [self-hosted, linux, x64, atlas, matterstate, nixos]
    timeout-minutes: 20
    steps:
      # Keep deploy-key URL rewrites from leaking into subsequent runner jobs.
      - name: Isolate Git configuration
        run: |
          printf 'GIT_CONFIG_GLOBAL=%s/gitconfig\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install locked test and reference dependencies
        run: nix develop --command uv sync --frozen --group reference --reinstall-package matterstate-envs
      - name: Verify source and parity contracts
        run: nix develop --command check
