[package]
name = "matterstate-envs"
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/matterstate/simulators"
description = "Fast native Rust simulator kernels with zero-dependency Python bindings"
keywords = ["rl", "simulator", "simd", "sokoban", "pusht"]

[lib]
name = "matterstate_envs"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"], optional = true }

[dev-dependencies]
hegeltest = "0.54"

[[bench]]
name = "sokoban"
harness = false

[[bench]]
name = "continuous"
harness = false

[[bench]]
name = "scaling"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
