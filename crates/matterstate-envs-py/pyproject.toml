[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "matterstate-envs-rs"
version = "0.1.0"
description = "PyO3 bindings for the Rust matterstate-envs simulator kernels"
requires-python = ">=3.13,<3.14"
dependencies = ["numpy>=2.0"]

[tool.maturin]
module-name = "matterstate_envs_rs"
