id: runtime-imports
language: Python
severity: error
message: Runtime kernels may import only numpy and matterstate_envs.
files:
  - matterstate_envs/**/*.py
rule:
  any:
    - pattern: import $MODULE as $ALIAS
    - pattern: import $MODULE
    - pattern: from $MODULE import $$$NAMES
constraints:
  MODULE:
    not:
      regex: "^(numpy|matterstate_envs)(\\.|$)"
