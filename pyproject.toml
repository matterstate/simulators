[project]
name = "matterstate-envs"
version = "0.1.0"
description = "Research simulators with separately tested reference parity"
requires-python = ">=3.13,<3.14"
dependencies = ["numpy==2.3.5"]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["python"]
module-name = "matterstate_envs._rs"
python-source = "."

[dependency-groups]
dev = [
    "hegel-core>=0.10.0",
    "pytest>=8",
    "syrupy>=4",
]
reference = [
  "gym-sokoban==0.0.6",
  "gymnasium[mujoco]>=1.1,<2",
  "gymnasium-robotics>=1.4.2",
  "gym-pusht>=0.1",
  "setuptools<81",
]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["reference: requires the test-only external reference engines"]
